<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Napzak Admin · 메인</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		.profile-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #e9ecef; }
		.table th, .table td { text-align: center; vertical-align: middle; font-size: 0.875rem; }
	</style>
</head>
<body class="bg-light">

<!-- 메뉴바 -->
<nav class="navbar bg-white border-bottom shadow-sm px-4">
	<div class="d-flex align-items-center gap-2">
		<div class="dropdown">
			<button class="btn btn-outline-secondary" type="button" id="menuButton"
					data-bs-toggle="dropdown" aria-expanded="false" aria-label="메뉴 열기">
				<span class="navbar-toggler-icon" style="width:1.2em;height:1.2em;"></span>
			</button>
			<ul class="dropdown-menu" aria-labelledby="menuButton">
				<li><a class="dropdown-item" href="/admin">대시보드</a></li>
				<li><a class="dropdown-item" href="/admin/users">유저 목록</a></li>
				<li><a class="dropdown-item" href="/admin/reports/store">유저 신고내역</a></li>
				<li><a class="dropdown-item" href="/admin/chats">최신 채팅내역</a></li>
			</ul>
		</div>
		<a class="navbar-brand fw-bold m-0" href="/admin">Napzak Admin</a>
	</div>
	<form th:action="@{/admin/logout}" method="post" class="m-0 ms-auto">
		<button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
	</form>
</nav>

<div class="container-fluid p-4">

	<!-- 유저 목록 -->
	<div class="card mb-4 shadow-sm border-0">
		<div class="card-header bg-white d-flex justify-content-between align-items-center">
			<span class="fw-semibold">유저 목록 <small class="text-muted">(가입일 최신 7명)</small></span>
			<a href="/admin/users" class="small">더보기</a>
		</div>
		<div class="card-body p-0">
			<table class="table table-hover mb-0">
				<thead class="table-light">
				<tr>
					<th>id</th><th>프로필</th><th>닉네임</th><th>ROLE</th><th>가입일</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="user : ${dashboard.users}">
					<td th:text="${user.id}">1</td>
					<td><img class="profile-img" th:src="${user.photo}" alt=""></td>
					<td th:text="${user.nickname}">닉네임</td>
					<td><span class="badge bg-secondary" th:text="${user.role}">STORE</span></td>
					<td th:text="${user.createdAt}">2026-06-15 12:00</td>
				</tr>
				<tr th:if="${dashboard.users.isEmpty()}">
					<td colspan="5" class="text-center text-muted py-4">데이터가 없습니다.</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- 유저 신고내역 -->
	<div class="card mb-4 shadow-sm border-0">
		<div class="card-header bg-white d-flex justify-content-between align-items-center">
			<span class="fw-semibold">유저 신고내역 <small class="text-muted">(최신 7개)</small></span>
			<a href="/admin/reports/store" class="small">더보기</a>
		</div>
		<div class="card-body p-0">
			<table class="table table-hover mb-0">
				<thead class="table-light">
				<tr>
					<th>id</th><th>프로필</th><th>닉네임</th><th>ROLE</th><th>승인</th><th>신고일</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="report : ${dashboard.storeReports}">
					<td th:text="${report.id}">1</td>
					<td><img class="profile-img" th:src="${report.profile}" alt=""></td>
					<td th:text="${report.nickname}">닉네임</td>
					<td><span class="badge bg-secondary" th:text="${report.role}">STORE</span></td>
					<td>
						<span class="badge"
							  th:classappend="${report.approvalStatus == 'APPROVED'} ? 'bg-success' : (${report.approvalStatus == 'PENDING'} ? 'bg-warning text-dark' : 'bg-secondary')"
							  th:text="${report.approvalStatus}">PENDING</span>
					</td>
					<td th:text="${report.createdAt}">2026-06-15</td>
				</tr>
				<tr th:if="${dashboard.storeReports.isEmpty()}">
					<td colspan="6" class="text-center text-muted py-4">데이터가 없습니다.</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- 최신 채팅내역 -->
	<div class="card mb-4 shadow-sm border-0">
		<div class="card-header bg-white d-flex justify-content-between align-items-center">
			<span class="fw-semibold">최신 채팅내역 <small class="text-muted">(30개)</small></span>
			<a href="/admin/chats" class="small">더보기</a>
		</div>
		<div class="card-body p-0" style="max-height: 360px; overflow-y: auto;">
			<table class="table table-hover table-sm mb-0">
				<thead class="table-light">
				<tr>
					<th>id</th><th>상점ID</th><th>프로필이미지</th><th>닉네임</th><th>내용</th><th>전송시각</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="chat : ${dashboard.chats}">
					<td th:text="${chat.id}">1</td>
					<td th:text="${chat.senderId}">5</td>
					<td><img class="profile-img" th:src="${chat.senderProfile}" alt=""></td>
					<td th:text="${chat.senderNickname}">닉네임</td>
					<td class="text-truncate" style="max-width: 400px;" th:text="${chat.content}">메시지 내용</td>
					<td th:text="${chat.createdAt}">2026-06-15 12:00</td>
				</tr>
				<tr th:if="${dashboard.chats.isEmpty()}">
					<td colspan="6" class="text-center text-muted py-4">데이터가 없습니다.</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
