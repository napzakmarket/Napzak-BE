<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Napzak Admin · 로그인</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
	<div class="card shadow-sm border-0" style="width: 360px;">
		<div class="card-body p-4">
			<h1 class="h3 fw-bold text-center mb-4">로고</h1>

			<div th:if="${error}" class="alert alert-danger py-2" th:text="${error}">에러 메시지</div>

			<form th:action="@{/admin/login}" method="post">
				<div class="mb-3">
					<label for="loginId" class="form-label">id</label>
					<input type="text" class="form-control" id="loginId" name="loginId" required autofocus>
				</div>
				<div class="mb-4">
					<label for="password" class="form-label">pwd</label>
					<input type="password" class="form-control" id="password" name="password" required>
				</div>
				<button type="submit" class="btn btn-primary w-100">로그인</button>
			</form>
		</div>
	</div>
</div>
</body>
</html>
