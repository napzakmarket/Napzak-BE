<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Napzak Admin · 최신 채팅내역</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		.profile-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #e9ecef; }
		.table th, .table td { text-align: center; vertical-align: middle; font-size: 0.875rem; }
	</style>
</head>
<body class="bg-light">

<!-- 메뉴바 -->
<nav class="navbar bg-white border-bottom shadow-sm px-4">
	<div class="d-flex align-items-center gap-2">
		<div class="dropdown">
			<button class="btn border-0 px-2" type="button" id="menuButton"
					data-bs-toggle="dropdown" aria-expanded="false" aria-label="메뉴 열기">
				<span class="navbar-toggler-icon" style="width:1.2em;height:1.2em;"></span>
			</button>
			<ul class="dropdown-menu" aria-labelledby="menuButton">
				<li><a class="dropdown-item" href="/admin">대시보드</a></li>
				<li><a class="dropdown-item" href="/admin/users">유저 목록</a></li>
				<li><a class="dropdown-item" href="/admin/reports/store">유저 신고내역</a></li>
				<li><a class="dropdown-item" href="/admin/chats">최신 채팅내역</a></li>
			</ul>
		</div>
		<a class="navbar-brand fw-bold m-0" href="/admin">Napzak Admin</a>
	</div>
	<form th:action="@{/admin/logout}" method="post" class="m-0 ms-auto">
		<button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
	</form>
</nav>

<div class="container-fluid p-4">

	<!-- 채팅내역 -->
	<div class="card mb-4 shadow-sm border-0">
		<div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
			<span class="fw-semibold">채팅내역 <small class="text-muted">전송시각 최신순</small></span>
			<form method="get" th:action="@{/admin/chats}" class="d-flex gap-2 m-0 align-items-center">
				<a th:if="${chatList.keyword != null}" href="/admin/chats"
				   class="btn btn-sm btn-link text-decoration-underline px-1">초기화</a>
				<select name="type" class="form-select form-select-sm" style="width: 130px;">
					<option value="room" th:selected="${chatList.searchType == 'room'}">채팅방 ID</option>
					<option value="nickname" th:selected="${chatList.searchType == 'nickname'}">닉네임</option>
				</select>
				<input type="text" name="q" class="form-control form-control-sm" style="width: 200px;"
					   placeholder="검색어" th:value="${chatList.keyword}">
				<button type="submit" class="btn btn-sm btn-outline-dark">검색</button>
			</form>
		</div>
		<div class="card-body p-0">
			<table class="table table-hover mb-0">
				<thead class="table-light">
				<tr>
					<th>id</th><th>채팅방 ID</th><th>상점ID</th><th>프로필이미지</th><th>닉네임</th><th>내용</th><th>전송시각</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="chat : ${chatList.chats}">
					<td th:text="${chat.id}">1</td>
					<td th:text="${chat.roomId}">7</td>
					<td th:text="${chat.senderId}">5</td>
					<td><img class="profile-img" th:src="${chat.senderProfile}" alt=""></td>
					<td th:text="${chat.senderNickname}">닉네임</td>
					<td class="text-truncate" style="max-width: 480px;" th:text="${chat.content}">메시지 내용</td>
					<td th:text="${chat.createdAt}">2026-06-15 12:00</td>
				</tr>
				<tr th:if="${chatList.chats.isEmpty()}">
					<td colspan="7" class="text-center text-muted py-4">데이터가 없습니다.</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- 페이지네이션 -->
	<nav th:if="${chatList.totalPages > 0}">
		<ul class="pagination justify-content-center">
			<li class="page-item" th:classappend="${!chatList.hasPrevious} ? 'disabled'">
				<a class="page-link" th:href="@{/admin/chats(page=${chatList.currentPage - 1}, type=${chatList.searchType}, q=${chatList.keyword})}">&laquo;</a>
			</li>
			<li class="page-item" th:each="p : ${chatList.pageNumbers}"
				th:classappend="${p == chatList.currentPage} ? 'active'">
				<a class="page-link" th:href="@{/admin/chats(page=${p}, type=${chatList.searchType}, q=${chatList.keyword})}" th:text="${p + 1}">1</a>
			</li>
			<li class="page-item" th:classappend="${!chatList.hasNext} ? 'disabled'">
				<a class="page-link" th:href="@{/admin/chats(page=${chatList.currentPage + 1}, type=${chatList.searchType}, q=${chatList.keyword})}">&raquo;</a>
			</li>
		</ul>
	</nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
