<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{imageUrl}}" />
    <meta property="og:url" content="{{pageUrl}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="납작마켓" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{imageUrl}}" />

    <title>{{title}}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #2f2f2f;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .share-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px 56px;
            background: #ffffff;
        }

        .share-content {
            width: 100%;
            max-width: 294px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .share-illustration {
            width: 160px;
            max-width: 58vw;
            height: auto;
            display: block;
            margin: 0 0 34px;
        }

        .share-title {
            width: 240px;
            margin: 0;
            color: #333333;
            font-size: 18px;
            line-height: 23px;
            font-weight: 600;
            letter-spacing: 0;
            word-break: keep-all;
        }

        .share-subtitle {
            width: 294px;
            margin: 12px 0 0;
            color: #8a8a8a;
            font-size: 14px;
            line-height: 18px;
            font-weight: 600;
            letter-spacing: 0;
            word-break: keep-all;
        }

        .share-button-group {
            width: 266px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 48px;
        }

        .store-guide-text {
            margin: 14px 0 12px;
            color: #8a8a8a;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 500;
            letter-spacing: -0.03em;
            word-break: keep-all;
        }

        .store-button-group {
            width: 266px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .share-button,
        .share-button:link,
        .share-button:visited {
            width: 266px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            padding: 0 16px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -0.03em;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            font-family: inherit;
        }

        .share-button-primary {
            background: #7534ff;
            color: #ffffff;
        }

        .share-button-secondary,
        .share-button-secondary:link,
        .share-button-secondary:visited {
            background: #B2A4FF;
            color: #111111;
        }

        .share-button:hover,
        .share-button:active {
            opacity: 0.92;
        }

        @media (max-width: 480px) {
            .share-page {
                padding: 32px 20px 48px;
            }

            .share-content {
                max-width: 294px;
            }

            .share-illustration {
                width: 160px;
                margin-bottom: 34px;
            }

            .share-title {
                width: 240px;
                font-size: 18px;
                line-height: 23px;
            }

            .share-subtitle {
                width: 294px;
                font-size: 14px;
                line-height: 18px;
            }

            .share-button-group {
                width: 266px;
                margin-top: 48px;
            }

            .store-guide-text {
                margin: 14px 0 12px;
                font-size: 13px;
            }

            .store-button-group {
                width: 266px;
                gap: 12px;
            }

            .share-button,
            .share-button:link,
            .share-button:visited {
                width: 266px;
                height: 48px;
                padding: 0 16px;
                border-radius: 8px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<main class="share-page">
    <section class="share-content">
        <img
                class="share-illustration"
                src="/images/napzak-share-illustration.png"
                alt="납작마켓 안내 이미지"
        />

        <h1 class="share-title">{{bodyTitle}}</h1>

        {{bodyDescriptionHtml}}

        <div class="share-button-group">
            <button
                    id="open-app-button"
                    type="button"
                    class="share-button share-button-primary"
            >
                납작마켓 앱에서 보기
            </button>

            <p class="store-guide-text">
                아직 앱이 없다면 스토어에서 설치해 주세요.
            </p>

            <div class="store-button-group">
                <a
                        href="{{appStoreUrl}}"
                        class="share-button share-button-secondary"
                >
                    App Store에서 다운로드
                </a>

                <a
                        href="{{playStoreUrl}}"
                        class="share-button share-button-secondary"
                >
                    Google Play에서 다운로드
                </a>
            </div>
        </div>
    </section>
</main>

<script>
    (function () {
        const APP_DEEP_LINK_URL = '{{appDeepLinkUrl}}';
        const AUTO_OPEN_DELAY_MS = 500;
        const AUTO_OPEN_STORAGE_KEY = 'napzak_auto_open_attempted:' + window.location.pathname;

        function hasAutoOpenAttempted() {
            try {
                return sessionStorage.getItem(AUTO_OPEN_STORAGE_KEY) === 'true';
            } catch (error) {
                return window.__napzakAutoOpenAttempted === true;
            }
        }

        function markAutoOpenAttempted() {
            try {
                sessionStorage.setItem(AUTO_OPEN_STORAGE_KEY, 'true');
            } catch (error) {
                window.__napzakAutoOpenAttempted = true;
            }
        }

        function openApp() {
            window.location.href = APP_DEEP_LINK_URL;
        }

        function tryAutoOpen() {
            if (hasAutoOpenAttempted()) {
                return;
            }

            window.setTimeout(function () {
                markAutoOpenAttempted();
                openApp();
            }, AUTO_OPEN_DELAY_MS);
        }

        const openAppButton = document.getElementById('open-app-button');

        if (openAppButton) {
            openAppButton.addEventListener('click', function () {
                openApp();
            });
        }

        tryAutoOpen();
    })();
</script>
</body>
</html>
